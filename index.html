<title>Pizzeria Antonio — Alaquàs</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #0f0700;
  --bg2: #1c0e00;
  --red: #c0392b;
  --red-light: #e74c3c;
  --gold: #d4a843;
  --gold-light: #f0c96a;
  --cream: #fdf6ec;
  --cream-dark: #f0e6d0;
  --text: #1a0a00;
  --text-muted: #6b5040;
  --text-light: #9b8070;
  --white: #ffffff;
  --radius: 16px;
  --radius-sm: 10px;
  --header-h: 70px;
  --nav-h: 50px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
  padding-bottom: calc(90px + var(--safe-bottom));
}
img { display: block; max-width: 100%; }
button { border: none; background: none; cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; }

/* ── HEADER ── */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: linear-gradient(135deg, #1a0a00 0%, #3d1200 50%, #1a0a00 100%);
  padding-top: var(--safe-top);
  height: calc(var(--header-h) + var(--safe-top));
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  border-bottom: 1px solid rgba(212,168,67,0.3);
}
.header-inner { display: flex; align-items: center; justify-content: space-between; height: var(--header-h); padding: 0 16px; }
.header-brand { display: flex; flex-direction: column; line-height: 1.1; }
.header-logo { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; color: var(--gold-light); letter-spacing: 0.06em; }
.header-sub { font-size: 10px; color: rgba(212,168,67,0.6); letter-spacing: 0.08em; margin-top: 2px; }
.header-pizza { font-size: 28px; margin-right: 6px; }
.header-left { display: flex; align-items: center; }
.header-actions { display: flex; gap: 6px; align-items: center; }
.hbtn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: white; text-decoration: none; font-size: 18px;
  position: relative; transition: background 0.2s;
  border: 1px solid rgba(212,168,67,0.2);
}
.hbtn:active { background: rgba(255,255,255,0.15); transform: scale(0.94); }
.allergen-badge { position: absolute; top: 3px; right: 3px; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; border: 1.5px solid #1a0a00; display: none; }

/* ── NAV ── */
#nav {
  position: fixed; left: 0; right: 0; z-index: 90;
  top: calc(var(--header-h) + var(--safe-top));
  background: linear-gradient(135deg, #1a0a00 0%, #3d1200 100%);
  border-bottom: 1px solid rgba(212,168,67,0.2);
}
.nav-scroll { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 0 8px; }
.nav-scroll::-webkit-scrollbar { display: none; }
.nav-tab {
  flex-shrink: 0; padding: 0 18px; height: var(--nav-h);
  font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.5);
  letter-spacing: 0.05em; text-transform: uppercase;
  position: relative; transition: color 0.2s; white-space: nowrap;
}
.nav-tab.active { color: var(--gold-light); }
.nav-tab.active::after { content: ''; position: absolute; bottom: 0; left: 18px; right: 18px; height: 2px; background: var(--red); border-radius: 2px 2px 0 0; }

/* ── SUBNAV ── */
#subnav {
  position: sticky;
  top: calc(var(--header-h) + var(--nav-h) + var(--safe-top));
  z-index: 80; background: var(--cream);
  border-bottom: 1px solid var(--cream-dark);
  padding: 10px 16px;
}
.subnav-scroll { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.subnav-scroll::-webkit-scrollbar { display: none; }
.sub-tab {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 500; color: var(--text-muted);
  background: var(--cream-dark); transition: all 0.18s; white-space: nowrap; min-height: 32px;
}
.sub-tab.active { background: var(--red); color: white; }

/* ── CONTENT ── */
#content { padding-top: calc(var(--header-h) + var(--nav-h) + var(--safe-top) + 10px); }
.section-header { padding: 24px 16px 12px; }
.section-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 10px; }
.section-count { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.dishes-list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }

/* ── DISH CARD ── */
.dish-card {
  background: var(--white); border-radius: var(--radius);
  display: flex; align-items: stretch; overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  transition: transform 0.15s, box-shadow 0.15s; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border: 1px solid rgba(0,0,0,0.04);
}
.dish-card:active { transform: scale(0.98); box-shadow: 0 1px 8px rgba(0,0,0,0.05); }
.dish-info { flex: 1; padding: 14px 12px 14px 14px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.dish-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 5px; }
.dish-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
.dish-footer { display: flex; align-items: center; justify-content: space-between; }
.dish-price { font-size: 17px; font-weight: 600; color: var(--red); }
.dish-allergens { display: flex; gap: 3px; flex-wrap: wrap; }
.alg-icon { width: 20px; height: 20px; border-radius: 4px; background: var(--cream-dark); display: flex; align-items: center; justify-content: center; font-size: 10px; }
.dish-img-wrap { width: 96px; flex-shrink: 0; }
.dish-img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1/1; }
.dish-img-placeholder { width: 96px; height: 96px; background: linear-gradient(135deg, #f5e6d0, #ecdbc0); display: flex; align-items: center; justify-content: center; font-size: 32px; }

/* ── FILTER ── */
#filter-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
#filter-overlay.open { opacity: 1; pointer-events: all; }
#filter-panel { position: absolute; bottom: 0; left: 0; right: 0; background: var(--white); border-radius: 24px 24px 0 0; padding: 0 0 calc(24px + var(--safe-bottom)); max-height: 88vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
#filter-overlay.open #filter-panel { transform: translateY(0); }
.filter-handle { width: 36px; height: 4px; background: var(--cream-dark); border-radius: 2px; margin: 12px auto 0; }
.filter-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
.filter-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; }
.filter-close { width: 44px; height: 44px; border-radius: 50%; background: var(--cream-dark); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.filter-desc { padding: 0 20px 16px; font-size: 13px; color: var(--text-muted); }
.filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 20px 16px; }
.filter-item { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius-sm); background: var(--cream); cursor: pointer; transition: background 0.15s; }
.filter-item.selected { background: #fde8e6; }
.filter-item.selected .fcheck { background: var(--red); border-color: var(--red); color: white; }
.fcheck { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--cream-dark); background: white; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; transition: all 0.15s; }
.filter-label { font-size: 12px; font-weight: 500; }
.filter-footer { padding: 12px 20px 0; display: flex; gap: 10px; }
.btn-clear { flex: 1; height: 48px; border: 1.5px solid var(--cream-dark); border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; color: var(--text-muted); background: white; }
.btn-apply { flex: 2; height: 48px; background: var(--red); border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; color: white; }
.btn-apply:active, .btn-clear:active { transform: scale(0.97); }
.filter-chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px 4px 8px; background: var(--red); color: white; border-radius: 20px; font-size: 11px; font-weight: 500; }
.chip-x { font-size: 13px; opacity: 0.7; cursor: pointer; }
#counter-bar { position: fixed; top: calc(var(--header-h) + var(--nav-h) + var(--safe-top)); left: 0; right: 0; z-index: 85; background: #fff3f2; border-bottom: 1px solid #f5c6c2; padding: 8px 16px; display: none; align-items: center; justify-content: space-between; font-size: 12px; color: #8b2020; }
#counter-bar.visible { display: flex; }
#filter-chips-bar { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── MODAL ── */
#modal-overlay { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.65); opacity: 0; pointer-events: none; transition: opacity 0.25s; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#modal-overlay.open { opacity: 1; pointer-events: all; }
#modal { background: var(--white); border-radius: 24px 24px 0 0; position: absolute; bottom: 0; left: 0; right: 0; max-height: 92vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); padding-bottom: calc(24px + var(--safe-bottom)); }
#modal-overlay.open #modal { transform: translateY(0); }
.modal-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.modal-img-placeholder { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, #f5e6d0, #ecdbc0); display: flex; align-items: center; justify-content: center; font-size: 70px; }
.modal-close-btn { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.35); color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 20px 20px 0; }
.modal-category { font-size: 11px; font-weight: 500; color: var(--red); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.modal-name { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600; line-height: 1.2; margin-bottom: 10px; }
.modal-price { font-size: 24px; font-weight: 600; color: var(--red); margin-bottom: 16px; }
.modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 20px; }
.modal-alg-title { font-size: 12px; font-weight: 500; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.modal-alg-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.modal-alg-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--cream); border-radius: 8px; font-size: 12px; }
.no-alg { font-size: 13px; color: var(--text-muted); font-style: italic; }

/* ── QR ── */
#qr-overlay { position: fixed; inset: 0; z-index: 400; background: rgba(26,10,0,0.95); opacity: 0; pointer-events: none; transition: opacity 0.25s; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; padding: 24px; }
#qr-overlay.open { opacity: 1; pointer-events: all; }
#qr-box { background: white; padding: 20px; border-radius: 20px; text-align: center; }
.qr-url { font-size: 10px; color: var(--text-muted); margin-top: 10px; word-break: break-all; max-width: 220px; }
.qr-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--gold-light); }
.qr-sub { font-size: 13px; color: rgba(255,255,255,0.5); text-align: center; }
.qr-actions { display: flex; gap: 10px; }
.qr-btn { padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; transition: transform 0.15s; }
.qr-btn:active { transform: scale(0.96); }
.qr-download { background: var(--gold); color: #1a0a00; }
.qr-close-btn { background: rgba(255,255,255,0.12); color: white; }

/* ── WA FAB ── */
#wa-fab { position: fixed; right: 16px; bottom: calc(20px + var(--safe-bottom)); z-index: 150; width: 54px; height: 54px; border-radius: 50%; background: #25D366; box-shadow: 0 4px 20px rgba(37,211,102,0.4); display: flex; align-items: center; justify-content: center; text-decoration: none; transition: transform 0.2s; }
#wa-fab:active { transform: scale(0.93); }
#wa-fab svg { width: 28px; height: 28px; fill: white; }

/* ── EMPTY ── */
.empty-state { text-align: center; padding: 60px 24px; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--text-muted); }
</style>
</head>

const state = { activeCat: CATEGORIAS[0].id, activeSub: null, activeFilters: new Set() };

function getAlg(ids){ return ids.map(id=>ALERGENOS.find(a=>a.id===id)).filter(Boolean); }
function isVisible(p){ return state.activeFilters.size===0||!p.alergenos.some(a=>state.activeFilters.has(a)); }

function renderNav(){
  document.getElementById('nav-scroll').innerHTML=CATEGORIAS.map(c=>
    `<button class="nav-tab ${c.id===state.activeCat?'active':''}" data-cat="${c.id}">${c.emoji} ${c.label}</button>`
  ).join('');
}

function renderSubnav(){
  const cat=CATEGORIAS.find(c=>c.id===state.activeCat);
  if(!cat?.subs.length){document.getElementById('subnav').style.display='none';return;}
  document.getElementById('subnav').style.display='';
  document.getElementById('subnav-scroll').innerHTML=
    `<button class="sub-tab ${!state.activeSub?'active':''}" data-sub="">Todos</button>`+
    cat.subs.map(s=>`<button class="sub-tab ${state.activeSub===s?'active':''}" data-sub="${s}">${s}</button>`).join('');
}

function renderContent(){
  const cat=CATEGORIAS.find(c=>c.id===state.activeCat);
  if(!cat)return;
  const platos=cat.platos.filter(p=>!state.activeSub||p.sub===state.activeSub);
  const vis=platos.filter(isVisible);
  let html=`<div class="section-header"><div class="section-title">${cat.emoji} ${cat.label}</div><div class="section-count">${vis.length} opción${vis.length!==1?'es':''}</div></div><div class="dishes-list">`;
  if(!vis.length){
    html+=`<div class="empty-state"><div class="empty-icon">🚫</div><div class="empty-title">Sin opciones disponibles</div><div class="empty-sub">Todos los platos contienen tus alérgenos filtrados.</div></div>`;
  } else {
    vis.forEach(p=>{
      const algs=getAlg(p.alergenos).slice(0,5);
      html+=`<div class="dish-card" data-id="${p.id}">
        <div class="dish-info">
          <div><div class="dish-name">${p.name}</div><div class="dish-desc">${p.desc}</div></div>
          <div class="dish-footer"><span class="dish-price">€${p.price}</span>
          <div class="dish-allergens">${algs.map(a=>`<span class="alg-icon" title="${a.label}">${a.icon}</span>`).join('')}</div></div>
        </div>
        <div class="dish-img-wrap">
          ${p.img?`<img class="dish-img" src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:``}
          <div class="dish-img-placeholder" style="display:${p.img?'none':'flex'}">${cat.emoji}</div>
        </div>
      </div>`;
    });
  }
  html+='</div>';
  document.getElementById('content').innerHTML=html;
  updateCounter();
}

function setCategoria(id){state.activeCat=id;state.activeSub=null;renderNav();renderSubnav();renderContent();document.querySelector('.nav-tab.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});window.scrollTo({top:0});}
function setSub(s){state.activeSub=s||null;renderSubnav();renderContent();}

function openModal(id){
  const p=CATEGORIAS.flatMap(c=>c.platos).find(p=>p.id===id);
  if(!p)return;
  const cat=CATEGORIAS.find(c=>c.platos.includes(p));
  document.getElementById('modal-category').textContent=(cat?.label||'')+(p.sub?' · '+p.sub:'');
  document.getElementById('modal-name').textContent=p.name;
  document.getElementById('modal-price').textContent='€'+p.price;
  document.getElementById('modal-desc').innerHTML=p.desc;
  document.getElementById('modal-img-container').innerHTML=p.img
    ?`<img class="modal-img" src="${p.img}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="modal-img-placeholder" style="display:none">${cat?.emoji||'🍕'}</div>`
    :`<div class="modal-img-placeholder">${cat?.emoji||'🍕'}</div>`;
  const algs=getAlg(p.alergenos);
  document.getElementById('modal-alg-list').innerHTML=algs.length
    ?algs.map(a=>`<div class="modal-alg-item"><span>${a.icon}</span><span>${a.label}</span></div>`).join('')
    :'<span class="no-alg">Sin alérgenos declarados</span>';
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');document.body.style.overflow='';}

function renderFilterGrid(){
  document.getElementById('filter-grid').innerHTML=ALERGENOS.map(a=>
    `<div class="filter-item ${state.activeFilters.has(a.id)?'selected':''}" data-alg="${a.id}">
      <div class="fcheck">${state.activeFilters.has(a.id)?'✓':''}</div>
      <span>${a.icon}</span><span class="filter-label">${a.label}</span>
    </div>`
  ).join('');
}
function openFilter(){renderFilterGrid();document.getElementById('filter-overlay').classList.add('open');document.body.style.overflow='hidden';}
function closeFilter(){document.getElementById('filter-overlay').classList.remove('open');document.body.style.overflow='';}

function updateCounter(){
  const bar=document.getElementById('counter-bar');
  if(!state.activeFilters.size){bar.classList.remove('visible');document.getElementById('allergen-badge').style.display='none';return;}
  bar.classList.add('visible');
  const cat=CATEGORIAS.find(c=>c.id===state.activeCat);
  const total=cat?.platos.length||0,vis=cat?.platos.filter(isVisible).length||0;
  document.getElementById('counter-text').textContent=`Mostrando ${vis} de ${total} opciones`;
  document.getElementById('filter-chips-bar').innerHTML=ALERGENOS.filter(a=>state.activeFilters.has(a.id))
    .map(a=>`<div class="filter-chip">${a.icon} ${a.label} <span class="chip-x" data-remove="${a.id}">✕</span></div>`).join('');
  document.getElementById('allergen-badge').style.display='block';
}

let qrDone=false;
function openQR(){
  const url=window.location.href.split('?')[0];
  document.getElementById('qr-url-text').textContent=url;
  if(!qrDone){document.getElementById('qr-canvas').innerHTML='';new QRCode(document.getElementById('qr-canvas'),{text:url,width:200,height:200,colorDark:'#1a0a00',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});qrDone=true;}
  document.getElementById('qr-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeQR(){document.getElementById('qr-overlay').classList.remove('open');document.body.style.overflow='';}
function downloadQR(){const c=document.querySelector('#qr-canvas canvas');if(!c)return;const a=document.createElement('a');a.download='menu-qr.png';a.href=c.toDataURL('image/png');a.click();}

document.getElementById('nav-scroll').addEventListener('click',e=>{const t=e.target.closest('.nav-tab');if(t)setCategoria(t.dataset.cat);});
document.getElementById('subnav-scroll').addEventListener('click',e=>{const t=e.target.closest('.sub-tab');if(t)setSub(t.dataset.sub);});
document.getElementById('content').addEventListener('click',e=>{const c=e.target.closest('.dish-card');if(c)openModal(Number(c.dataset.id));});
document.getElementById('allergen-btn').addEventListener('click',openFilter);
document.getElementById('filter-close-btn').addEventListener('click',closeFilter);
document.getElementById('filter-overlay').addEventListener('click',e=>{if(e.target.id==='filter-overlay')closeFilter();});
document.getElementById('filter-grid').addEventListener('click',e=>{const item=e.target.closest('.filter-item');if(item){const a=item.dataset.alg;state.activeFilters.has(a)?state.activeFilters.delete(a):state.activeFilters.add(a);renderFilterGrid();}});
document.getElementById('btn-clear-filters').addEventListener('click',()=>{state.activeFilters.clear();renderFilterGrid();closeFilter();renderContent();});
document.getElementById('btn-apply-filters').addEventListener('click',()=>{closeFilter();renderContent();});
document.getElementById('filter-chips-bar').addEventListener('click',e=>{const r=e.target.closest('[data-remove]');if(r){state.activeFilters.delete(r.dataset.remove);renderContent();}});
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
document.getElementById('qr-btn').addEventListener('click',openQR);
document.getElementById('qr-close-btn').addEventListener('click',closeQR);
document.getElementById('qr-download-btn').addEventListener('click',downloadQR);
document.getElementById('qr-overlay').addEventListener('click',e=>{if(e.target.id==='qr-overlay')closeQR();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeFilter();closeQR();}});

renderNav(); renderSubnav(); renderContent();
</script>
</body>
</html>
