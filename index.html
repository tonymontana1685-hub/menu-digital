<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3c26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CARTA — Restaurante Valencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --green-dark: #0b3c26;
    --green-mid: #145c3a;
    --green-light: #1e7a4e;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #faf7f2;
    --cream-dark: #f0ebe0;
    --text: #1a1a1a;
    --text-muted: #6b6560;
    --text-light: #9b9490;
    --white: #ffffff;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.14);
    --header-h: 60px;
    --nav-h: 50px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    overflow-x: hidden;
    min-height: 100vh;
    padding-bottom: calc(80px + var(--safe-bottom));
  }
  img { display: block; max-width: 100%; }
  button { border: none; background: none; cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; }

  /* ── HEADER ── */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--green-dark);
    padding-top: var(--safe-top);
    height: calc(var(--header-h) + var(--safe-top));
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: var(--header-h);
    padding: 0 16px;
  }
  .header-logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 600;
    color: var(--gold-light);
    letter-spacing: 0.12em;
  }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  .hbtn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: background 0.2s;
    color: white;
    text-decoration: none;
    font-size: 19px;
    position: relative;
  }
  .hbtn:active { background: rgba(255,255,255,0.2); transform: scale(0.94); }
  .hbtn .tooltip {
    display: none;
    position: absolute; top: 50px; right: 0;
    background: rgba(11,60,38,0.95); color: #fff;
    font-size: 11px; white-space: nowrap;
    padding: 4px 8px; border-radius: 6px;
    pointer-events: none;
  }
  .allergen-badge {
    position: absolute; top: 3px; right: 3px;
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    border: 1.5px solid var(--green-dark);
  }

  /* ── NAV TABS ── */
  #nav {
    position: fixed; left: 0; right: 0; z-index: 90;
    top: calc(var(--header-h) + var(--safe-top));
    background: var(--green-dark);
    border-bottom: 1px solid rgba(201,168,76,0.2);
  }
  .nav-scroll {
    display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; gap: 0;
    padding: 0 8px;
  }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .nav-tab {
    flex-shrink: 0;
    padding: 0 16px;
    height: var(--nav-h);
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    position: relative;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .nav-tab.active { color: var(--gold-light); }
  .nav-tab.active::after {
    content: '';
    position: absolute; bottom: 0; left: 16px; right: 16px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px 2px 0 0;
  }

  /* ── SUBCATEGORY TABS ── */
  #subnav {
    position: sticky;
    top: calc(var(--header-h) + var(--nav-h) + var(--safe-top));
    z-index: 80;
    background: var(--cream);
    border-bottom: 1px solid var(--cream-dark);
    padding: 10px 16px;
  }
  .subnav-scroll {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .subnav-scroll::-webkit-scrollbar { display: none; }
  .sub-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);
    background: var(--cream-dark);
    transition: all 0.18s;
    white-space: nowrap;
    min-height: 32px;
  }
  .sub-tab.active {
    background: var(--green-dark);
    color: var(--gold-light);
  }

  /* ── CONTENT AREA ── */
  #content {
    padding-top: calc(var(--header-h) + var(--nav-h) + var(--safe-top) + 10px);
    padding-left: 0; padding-right: 0;
  }
  .section-header {
    padding: 24px 16px 12px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px; font-weight: 500;
    color: var(--green-dark);
  }
  .section-count {
    font-size: 12px; color: var(--text-light);
    font-weight: 400;
  }
  .dishes-list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }

  /* ── DISH CARD ── */
  .dish-card {
    background: var(--white);
    border-radius: var(--radius);
    display: flex; align-items: stretch;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .dish-card:active { transform: scale(0.98); box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
  .dish-card.hidden { display: none; }
  .dish-info {
    flex: 1; padding: 14px 12px 14px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    min-width: 0;
  }
  .dish-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px; font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 5px;
  }
  .dish-desc {
    font-size: 12px; color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .dish-footer { display: flex; align-items: center; justify-content: space-between; }
  .dish-price {
    font-size: 16px; font-weight: 500;
    color: var(--green-dark);
  }
  .dish-allergens { display: flex; gap: 3px; flex-wrap: wrap; }
  .alg-icon {
    width: 20px; height: 20px;
    border-radius: 4px;
    background: var(--cream-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    title: attr(data-name);
  }
  .dish-img-wrap {
    width: 96px; flex-shrink: 0;
    position: relative;
  }
  .dish-img {
    width: 100%; height: 100%;
    object-fit: cover;
    aspect-ratio: 1/1;
  }
  .dish-img-placeholder {
    width: 100%; height: 100%;
    background: var(--cream-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }

  /* ── FILTER OVERLAY ── */
  #filter-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(11,60,38,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  #filter-overlay.open { opacity: 1; pointer-events: all; }
  #filter-panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--white);
    border-radius: 24px 24px 0 0;
    padding: 0 0 calc(24px + var(--safe-bottom));
    max-height: 88vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  #filter-overlay.open #filter-panel { transform: translateY(0); }
  .filter-handle {
    width: 36px; height: 4px;
    background: var(--cream-dark);
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .filter-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 8px;
  }
  .filter-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 500;
  }
  .filter-close {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--cream-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: var(--text);
  }
  .filter-desc { padding: 0 20px 16px; font-size: 13px; color: var(--text-muted); }
  .filter-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 0 20px 16px;
  }
  .filter-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px;
    border-radius: var(--radius-sm);
    background: var(--cream);
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-item.selected { background: #e8f5ee; }
  .filter-item.selected .fcheck {
    background: var(--green-dark); border-color: var(--green-dark);
    color: white;
  }
  .fcheck {
    width: 22px; height: 22px; border-radius: 5px;
    border: 1.5px solid var(--cream-dark);
    background: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
    transition: all 0.15s;
  }
  .filter-label { font-size: 12px; font-weight: 500; color: var(--text); }
  .filter-icon { font-size: 16px; }
  .filter-footer {
    padding: 12px 20px 0;
    display: flex; gap: 10px;
  }
  .btn-clear {
    flex: 1; height: 48px;
    border: 1.5px solid var(--cream-dark);
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500;
    color: var(--text-muted);
    background: white;
    transition: all 0.15s;
  }
  .btn-apply {
    flex: 2; height: 48px;
    background: var(--green-dark);
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500;
    color: white;
    transition: all 0.15s;
  }
  .btn-apply:active, .btn-clear:active { transform: scale(0.97); }
  .filter-chips {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 8px 16px 4px;
    min-height: 0;
  }
  .filter-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px 4px 8px;
    background: var(--green-dark);
    color: white;
    border-radius: 20px;
    font-size: 11px; font-weight: 500;
  }
  .chip-x { font-size: 13px; opacity: 0.7; cursor: pointer; }

  /* ── MODAL ── */
  #modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #modal-overlay.open { opacity: 1; pointer-events: all; }
  #modal {
    background: var(--white);
    border-radius: 24px 24px 0 0;
    position: absolute; bottom: 0; left: 0; right: 0;
    max-height: 92vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    padding-bottom: calc(24px + var(--safe-bottom));
  }
  #modal-overlay.open #modal { transform: translateY(0); }
  .modal-img {
    width: 100%; aspect-ratio: 16/9;
    object-fit: cover;
  }
  .modal-img-placeholder {
    width: 100%; aspect-ratio: 16/9;
    background: var(--cream-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 60px;
  }
  .modal-close-btn {
    position: absolute; top: 16px; right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.35);
    color: white; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-body { padding: 20px 20px 0; }
  .modal-category { font-size: 11px; font-weight: 500; color: var(--green-light); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .modal-name {
    font-family: 'Playfair Display', serif;
    font-size: 26px; font-weight: 500;
    line-height: 1.2; margin-bottom: 10px;
  }
  .modal-price { font-size: 24px; font-weight: 500; color: var(--green-dark); margin-bottom: 16px; }
  .modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 20px; }
  .modal-alg-title { font-size: 12px; font-weight: 500; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .modal-alg-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .modal-alg-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: var(--cream);
    border-radius: 8px;
    font-size: 12px; color: var(--text);
  }
  .no-alg { font-size: 13px; color: var(--text-muted); font-style: italic; }

  /* ── QR OVERLAY ── */
  #qr-overlay {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(11,60,38,0.92);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    padding: 24px;
  }
  #qr-overlay.open { opacity: 1; pointer-events: all; }
  #qr-box {
    background: white; padding: 20px; border-radius: 20px;
    text-align: center;
  }
  #qr-canvas { display: block; margin: 0 auto; }
  .qr-url { font-size: 10px; color: var(--text-muted); margin-top: 10px; word-break: break-all; max-width: 220px; }
  .qr-title { font-family: 'Playfair Display', serif; font-size: 18px; color: white; }
  .qr-sub { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; }
  .qr-actions { display: flex; gap: 10px; }
  .qr-btn {
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    transition: transform 0.15s;
  }
  .qr-btn:active { transform: scale(0.96); }
  .qr-download { background: var(--gold); color: var(--green-dark); }
  .qr-close-btn { background: rgba(255,255,255,0.15); color: white; }

  /* ── WHATSAPP FLOAT ── */
  #wa-fab {
    position: fixed; right: 16px;
    bottom: calc(20px + var(--safe-bottom));
    z-index: 150;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #25D366;
    box-shadow: 0 4px 16px rgba(37,211,102,0.4);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #wa-fab:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(37,211,102,0.3); }
  #wa-fab svg { width: 26px; height: 26px; fill: white; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center; padding: 60px 24px;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-title { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 6px; color: var(--text); }
  .empty-sub { font-size: 13px; color: var(--text-muted); }

  /* ── COUNTER BAR ── */
  #counter-bar {
    position: fixed; top: calc(var(--header-h) + var(--nav-h) + var(--safe-top));
    left: 0; right: 0; z-index: 85;
    background: #fff8e8;
    border-bottom: 1px solid #e8c97a;
    padding: 8px 16px;
    display: none; align-items: center; justify-content: space-between;
    font-size: 12px; color: #7a5c10;
  }
  #counter-bar.visible { display: flex; }
  .counter-bar-left { display: flex; align-items: center; gap: 8px; }

  /* ── BOTTOM SAFE AREA ── */
  .bottom-space { height: calc(80px + var(--safe-bottom)); }
</style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <div class="header-inner">
    <span class="header-logo">CARTA</span>
    <div class="header-actions">
      <button class="hbtn" id="qr-btn" aria-label="Ver código QR">🔳</button>

<nav id="nav" role="navigation" aria-label="Menu categories">

</nav>

</div>

      <div class="modal-category" id="modal-category"></div>
      <h2 class="modal-name" id="modal-name"></h2>
      <div class="modal-price" id="modal-price"></div>
      <p class="modal-desc" id="modal-desc"></p>

<!-- QR OVERLAY -->
<div id="qr-overlay" role="dialog" aria-modal="true">
  <p class="qr-title">Escanea para abrir la carta</p>
  <div id="qr-box">
    <div id="qr-canvas"></div>
    <p class="qr-url" id="qr-url-text"></p>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const state = {
  activeCat: CATEGORIES[0].id,
  activeSub: null,
  activeFilters: new Set(),
  modalDish: null
};

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function getAllergensForDish(allergenIds) {
  return allergenIds.map(id => ALLERGENS.find(a => a.id === id)).filter(Boolean);
}
function isDishVisible(dish) {
  if (state.activeFilters.size === 0) return true;
  return !dish.allergens.some(a => state.activeFilters.has(a));
}

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function renderNav() {
  const el = document.getElementById('nav-scroll');
  el.innerHTML = CATEGORIES.map(cat => `
    <button class="nav-tab ${cat.id === state.activeCat ? 'active' : ''}" data-cat="${cat.id}" aria-label="${cat.label}">
      ${cat.label}
    </button>
  `).join('');
}

function renderSubnav() {
  const cat = CATEGORIES.find(c => c.id === state.activeCat);
  if (!cat || !cat.subs.length) { document.getElementById('subnav').style.display = 'none'; return; }
  document.getElementById('subnav').style.display = '';
  const allSub = state.activeSub === null;
  document.getElementById('subnav-scroll').innerHTML =
    `<button class="sub-tab ${allSub ? 'active' : ''}" data-sub="">Todos</button>` +
    cat.subs.map(s => `<button class="sub-tab ${state.activeSub === s ? 'active' : ''}" data-sub="${s}">${s}</button>`).join('');
}

function setCategory(catId) {
  state.activeCat = catId;
  state.activeSub = null;
  renderNav();
  renderSubnav();
  renderContent();
  // Scroll nav tab into view
  const activeTab = document.querySelector('.nav-tab.active');
  if (activeTab) activeTab.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  window.scrollTo({top: 0});
}

function setSub(sub) {
  state.activeSub = sub || null;
  renderSubnav();
  renderContent();
}

// ─────────────────────────────────────────────
// CONTENT / DISHES
// ─────────────────────────────────────────────
function renderContent() {
  const cat = CATEGORIES.find(c => c.id === state.activeCat);
  if (!cat) return;
  const dishes = cat.dishes.filter(d => !state.activeSub || d.sub === state.activeSub);
  const visibleDishes = dishes.filter(isDishVisible);
  const content = document.getElementById('content');

  let html = `<div class="section-header">
    <h1 class="section-title">${cat.emoji} ${cat.label}</h1>
    <span class="section-count">${visibleDishes.length} plato${visibleDishes.length !== 1 ? 's' : ''}</span>
  </div>
  <div class="dishes-list" id="dishes-list">`;

  if (visibleDishes.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-icon">🚫</div>
      <div class="empty-title">Sin platos disponibles</div>
      <div class="empty-sub">Todos los platos contienen tus alérgenos filtrados.</div>
    </div>`;
  } else {
    visibleDishes.forEach(dish => {
      const algs = getAllergensForDish(dish.allergens).slice(0, 5);
      html += `<div class="dish-card" data-dish-id="${dish.id}" role="button" tabindex="0" aria-label="View ${dish.name}">
        <div class="dish-info">
          <div>
            <div class="dish-name">${dish.name}</div>
            <div class="dish-desc">${dish.desc}</div>
          </div>
          <div class="dish-footer">
            <span class="dish-price">€${dish.price}</span>
            <div class="dish-allergens">${algs.map(a => `<span class="alg-icon" title="${a.label}">${a.icon}</span>`).join('')}</div>
          </div>
        </div>
        <div class="dish-img-wrap">
          <img class="dish-img" src="${dish.img}" alt="${dish.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="dish-img-placeholder" style="display:none">${cat.emoji}</div>
        </div>
      </div>`;
    });
  }
  html += '</div>';
  content.innerHTML = html;
  updateCounterBar();
}

// ─────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────
function openModal(dishId) {
  const allDishes = CATEGORIES.flatMap(c => c.dishes);
  const dish = allDishes.find(d => d.id === dishId);
  if (!dish) return;
  const cat = CATEGORIES.find(c => c.dishes.includes(dish));

  document.getElementById('modal-category').textContent = (cat ? cat.label : '') + (dish.sub ? ' · ' + dish.sub : '');
  document.getElementById('modal-name').textContent = dish.name;
  document.getElementById('modal-price').textContent = '€' + dish.price;
  document.getElementById('modal-desc').textContent = dish.desc;

  const imgContainer = document.getElementById('modal-img-container');
  imgContainer.innerHTML = `<img class="modal-img" src="${dish.img}" alt="${dish.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="modal-img-placeholder" style="display:none">${cat ? cat.emoji : '🍽️'}</div>`;

  const algList = document.getElementById('modal-alg-list');
  const algs = getAllergensForDish(dish.allergens);
  if (algs.length === 0) {
    algList.innerHTML = '<span class="no-alg">Sin alérgenos declarados</span>';
  } else {
    algList.innerHTML = algs.map(a => `<div class="modal-alg-item"><span>${a.icon}</span><span>${a.label}</span></div>`).join('');
  }

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ─────────────────────────────────────────────
// FILTERS
// ─────────────────────────────────────────────
function renderFilterGrid() {
  const grid = document.getElementById('filter-grid');
  grid.innerHTML = ALLERGENS.map(a => `
    <div class="filter-item ${state.activeFilters.has(a.id) ? 'selected' : ''}" data-alg="${a.id}">
      <div class="fcheck">${state.activeFilters.has(a.id) ? '✓' : ''}</div>
      <span class="filter-icon">${a.icon}</span>
      <span class="filter-label">${a.label}</span>
    </div>
  `).join('');
}

function openFilter() {
  renderFilterGrid();
  document.getElementById('filter-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeFilter() {
  document.getElementById('filter-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function updateCounterBar() {
  const bar = document.getElementById('counter-bar');
  if (state.activeFilters.size === 0) { bar.classList.remove('visible'); return; }
  bar.classList.add('visible');
  const cat = CATEGORIES.find(c => c.id === state.activeCat);
  const total = cat ? cat.dishes.length : 0;
  const visible = cat ? cat.dishes.filter(isDishVisible).length : 0;
  document.getElementById('counter-text').textContent = `Mostrando ${visible} de ${total} platos`;
  const chipsBar = document.getElementById('filter-chips-bar');
  const activeAlgs = ALLERGENS.filter(a => state.activeFilters.has(a.id));
  chipsBar.innerHTML = activeAlgs.map(a =>
    `<div class="filter-chip">${a.icon} ${a.label} <span class="chip-x" data-remove="${a.id}">✕</span></div>`
  ).join('');
  document.getElementById('allergen-badge').style.display = state.activeFilters.size > 0 ? 'block' : 'none';
}

// ─────────────────────────────────────────────
// QR
// ─────────────────────────────────────────────
let qrGenerated = false;
function openQR() {
  const url = window.location.href.split('?')[0] + '?v=' + Date.now();
  document.getElementById('qr-url-text').textContent = url;
  if (!qrGenerated) {
    const container = document.getElementById('qr-canvas');
    container.innerHTML = '';
    new QRCode(container, {
      text: url,
      width: 200,
      height: 200,
      colorDark: '#0b3c26',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    qrGenerated = false;
  }
  document.getElementById('qr-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeQR() {
  document.getElementById('qr-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function downloadQR() {
  const canvas = document.querySelector('#qr-canvas canvas');
  if (!canvas) return;
  const link = document.createElement('a');
  link.download = 'menu-qr.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ─────────────────────────────────────────────
// EVENTS (delegation)
// ─────────────────────────────────────────────
document.getElementById('nav-scroll').addEventListener('click', e => {
  const tab = e.target.closest('.nav-tab');
  if (tab) setCategory(tab.dataset.cat);
});

document.getElementById('subnav-scroll').addEventListener('click', e => {
  const tab = e.target.closest('.sub-tab');
  if (tab) setSub(tab.dataset.sub);
});

document.getElementById('content').addEventListener('click', e => {
  const card = e.target.closest('.dish-card');
  if (card) openModal(Number(card.dataset.dishId));
});

document.getElementById('allergen-btn').addEventListener('click', openFilter);
document.getElementById('filter-close-btn').addEventListener('click', closeFilter);

document.getElementById('filter-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('filter-overlay')) closeFilter();
});

document.getElementById('filter-grid').addEventListener('click', e => {
  const item = e.target.closest('.filter-item');
  if (item) {
    const alg = item.dataset.alg;
    if (state.activeFilters.has(alg)) state.activeFilters.delete(alg);
    else state.activeFilters.add(alg);
    renderFilterGrid();
  }
});

document.getElementById('btn-clear-filters').addEventListener('click', () => {
  state.activeFilters.clear();
  renderFilterGrid();
  closeFilter();
  renderContent();
});

document.getElementById('btn-apply-filters').addEventListener('click', () => {
  closeFilter();
  renderContent();
});

document.getElementById('filter-chips-bar').addEventListener('click', e => {
  const rem = e.target.closest('[data-remove]');
  if (rem) {
    state.activeFilters.delete(rem.dataset.remove);
    renderContent();
  }
});

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

document.getElementById('qr-btn').addEventListener('click', openQR);
document.getElementById('qr-close-btn').addEventListener('click', closeQR);
document.getElementById('qr-download-btn').addEventListener('click', downloadQR);
document.getElementById('qr-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('qr-overlay')) closeQR();
});

// Keyboard accessibility
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeFilter(); closeQR(); }
});

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderNav();
renderSubnav();
renderContent();
</script>
